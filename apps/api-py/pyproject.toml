[project]
name = "shop-api"
version = "0.1.0"
description = "Python port of the Telegram order manager API"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "pillow>=13.0.0",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.33",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
